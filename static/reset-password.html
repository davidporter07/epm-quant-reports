<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061326" />
  <title>Reset Password | EPM Market Intelligence</title>
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #030a16; --bg-card: rgba(8,20,44,0.88); --border: rgba(28,52,96,0.65);
      --border-hi: rgba(74,140,255,0.45); --text: #e8eef8; --text-2: #8ba3c7;
      --text-3: #526886; --accent: #3b82f6; --accent-2: #60a5fa;
      --success: #22c55e; --danger: #ef4444; --radius: 14px; --radius-sm: 8px;
    }
    [data-theme="light"] {
      --bg: #f0f4fa; --bg-card: rgba(255,255,255,0.94); --border: rgba(20,44,90,0.14);
      --border-hi: rgba(59,130,246,0.4); --text: #0d1c2e; --text-2: #3a5070;
      --text-3: #7a94b4; --accent: #2563eb; --accent-2: #3b82f6;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,130,246,0.07) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 50% at 80% 90%, rgba(200,168,75,0.05) 0%, transparent 55%);
    }
    .shell { min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 16px; position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
    .brand-logo { width: 38px; height: 38px; border-radius: 10px; object-fit: contain; }
    .brand-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .brand-name span { display: block; font-size: 11px; font-weight: 400; color: var(--text-3);
      letter-spacing: 0.04em; text-transform: uppercase; margin-top: 1px; }
    .card { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 36px 32px; backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.22), 0 0 0 1px rgba(255,255,255,0.03) inset; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em; }
    .sub { font-size: 13px; color: var(--text-2); margin-bottom: 28px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2);
      margin-bottom: 6px; letter-spacing: 0.03em; text-transform: uppercase; }
    input[type="password"] { width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px;
      font-size: 14px; font-family: inherit; color: var(--text); outline: none;
      transition: border-color 0.18s, box-shadow 0.18s; caret-color: var(--accent-2); }
    [data-theme="light"] input[type="password"] { background: rgba(255,255,255,0.7); }
    input[type="password"]:focus { border-color: var(--border-hi); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    input[type="password"]::placeholder { color: var(--text-3); }
    .btn { width: 100%; padding: 12px 20px; background: linear-gradient(135deg,#2563eb,#3b82f6);
      border: none; border-radius: var(--radius-sm); color: #fff; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
      box-shadow: 0 2px 12px rgba(59,130,246,0.30); }
    .btn:hover:not(:disabled) { opacity: 0.92; }
    .btn:active:not(:disabled) { transform: scale(0.985); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 13px; padding: 10px 14px; border-radius: var(--radius-sm);
      margin-bottom: 16px; display: none; line-height: 1.5; }
    .msg.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5; display: block; }
    .msg.success { background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.25);
      color: #86efac; display: block; }
    .back-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-3); }
    .back-link a { color: var(--accent-2); text-decoration: none; font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }
    .expired-state { text-align: center; padding: 12px 0; }
    .expired-icon { font-size: 36px; margin-bottom: 14px; }
  </style>
  <link rel="icon" type="image/png" href="/static/epm_logo_sq.png">
  <link rel="apple-touch-icon" href="/static/epm_logo_sq.png">
  <meta property="og:image" content="/static/epm_logo.png">
</head>
<body>
  <script>
    (function(){try{var p=localStorage.getItem('epm_theme_pref')||'dark';var r=p==='system'?(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):p;document.documentElement.dataset.theme=r;document.body.dataset.theme=r;document.body.style.backgroundColor=r==='light'?'#f0f4fa':'#030a16';}catch(e){}})();
  </script>
  <div class="shell">
    <div class="brand">
      <img class="brand-logo" src="/static/epm_logo.png?v=20260322f" alt="EPM" />
      <div class="brand-name">EPM Market Intelligence <span>Quantitative research platform</span></div>
    </div>
    <div class="card" id="mainCard">
      <h1>Set new password</h1>
      <p class="sub">Choose a strong password for your account. It must be at least 6 characters.</p>
      <div class="msg" id="msg"></div>
      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="pw1">New Password</label>
          <input type="password" id="pw1" placeholder="Enter new password" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="pw2">Confirm Password</label>
          <input type="password" id="pw2" placeholder="Confirm new password" autocomplete="new-password" required />
        </div>
        <button class="btn" type="submit" id="submitBtn">Update Password</button>
      </form>
    </div>
    <div class="back-link"><a href="/login">Back to Sign In</a></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token') || '';
    const msg    = document.getElementById('msg');
    const btn    = document.getElementById('submitBtn');

    if (!token) {
      document.getElementById('mainCard').innerHTML = `
        <div class="expired-state">
          <div class="expired-icon">&#128274;</div>
          <h1 style="margin-bottom:10px;">Invalid link</h1>
          <p class="sub" style="margin-bottom:0;">This reset link is missing or malformed.
          Please request a new one from the sign-in page.</p>
        </div>`;
    }

    document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      if (!pw1 || pw1.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
      if (pw1 !== pw2) { showMsg('Passwords do not match.', 'error'); return; }
      btn.disabled = true; btn.textContent = 'Updating\u2026';
      msg.className = 'msg';
      try {
        const res  = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ token, new_password: pw1 }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) { showMsg(data.detail || 'Failed to reset password.', 'error'); btn.disabled=false; btn.textContent='Update Password'; return; }
        showMsg('Password updated! Redirecting to sign in\u2026', 'success');
        setTimeout(() => window.location.replace('/login'), 2200);
      } catch (_) {
        showMsg('Network error. Is the server running?', 'error');
        btn.disabled = false; btn.textContent = 'Update Password';
      }
    });

    function showMsg(text, type) { msg.textContent = text; msg.className = 'msg ' + type; }
  </script>
</body>
</html>
