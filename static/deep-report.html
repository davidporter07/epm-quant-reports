<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#132742" id="themeColorMeta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="appleStatusBarMeta" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('epm_theme_pref') || 'light';
        var resolved = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
        var bg = resolved === 'light' ? '#f5f8fd' : '#061326';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.backgroundColor = bg;
        var themeMeta = document.getElementById('themeColorMeta');
        if (themeMeta) themeMeta.setAttribute('content', bg);
      } catch (err) {
        document.documentElement.style.backgroundColor = '#061326';
      }
    })();
  </script>
  <script>
    (function () {
      try {
        var density = localStorage.getItem('epm_density_pref') || 'comfortable';
        document.documentElement.dataset.density = density;
      } catch (e) {}
    })();
  </script>
  <title>Deep Analysis Report | EPM Market Intelligence</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=20260410a" />
  <link rel="stylesheet" href="/static/css/design-v2.css?v=20260410a" />
  <link rel="stylesheet" href="/static/css/design-system.css?v=20260423a" />
  <script src="/static/js/chrome.js?v=20260423a"></script>
  <script defer src="/static/js/site.js?v=20260420c"></script>
  <link rel="icon" type="image/png" href="/static/epm_logo_sq.png">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body data-page="deep-report" data-ds="v3">
  <div id="epmChrome"></div>
  <script>if (window.EPMChrome) EPMChrome.render();</script>

  <div class="report-page">
    <a class="back-link" id="backLink" href="/search">← Back to Fund Search</a>

    <div class="report-actions" id="reportActions" style="display:none;">
      <button class="btn-copy" id="btnNewAnalysis" onclick="window.location.href=document.getElementById('backLink').href+'&newAnalysis=1#deepAnalysisLab'" style="border-color:rgba(212,168,75,0.35);color:#d4a84b;">
        + Run New Analysis
      </button>
      <button class="btn-copy" id="btnCopyLink" onclick="copyReportLink()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy Link
      </button>
      <button class="btn-pdf" onclick="window.print()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Download PDF
      </button>
    </div>

    <div id="loadingState" class="loading-state">
      <div class="pulsing" style="font-size:14px;">Loading report…</div>
    </div>

    <div id="errorState" class="error-state" style="display:none;"></div>

    <div id="reportContent" style="display:none;">
      <div class="report-header">
        <div class="report-pill">Analyst Council</div>
        <div class="report-ticker" id="rTicker"></div>
        <div class="report-title" id="rTitle"></div>
        <div class="report-meta" id="rMeta"></div>
      </div>

      <div id="rSummary" class="summary-card" style="display:none;"></div>

      <div id="rSections"></div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('job_id');
      const ticker = (params.get('ticker') || '').toUpperCase();

      const backLink = document.getElementById('backLink');
      if (ticker) backLink.href = `/search?ticker=${encodeURIComponent(ticker)}`;

      function showError(msg) {
        document.getElementById('loadingState').style.display = 'none';
        const e = document.getElementById('errorState');
        e.textContent = msg;
        e.style.display = '';
      }

      // Exposed globally so onclick= attribute can reach it
      window.copyReportLink = function () {
        const btn = document.getElementById('btnCopyLink');
        navigator.clipboard.writeText(window.location.href).then(() => {
          btn.textContent = '✓ Copied!';
          setTimeout(() => {
            btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy Link';
          }, 2000);
        }).catch(() => {
          // Fallback for browsers that block clipboard without user gesture
          const ta = document.createElement('textarea');
          ta.value = window.location.href;
          ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btn.textContent = '✓ Copied!';
          setTimeout(() => { btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy Link'; }, 2000);
        });
      };

      function renderReport(status) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('reportActions').style.display = '';
        const result = status.result;
        if (!result) { showError('Report data unavailable.'); return; }

        document.getElementById('rTicker').textContent = status.ticker || ticker;
        document.getElementById('rTitle').textContent = result.title || 'Deep Analysis Report';
        document.getElementById('rMeta').textContent =
          'Deep Analysis · Powered by Kronos + Analyst Council + EPM Ensemble · ' +
          (status.completed_at ? new Date(status.completed_at + 'Z').toLocaleString() : '');

        if (result.summary) {
          const s = document.getElementById('rSummary');
          s.textContent = result.summary;
          s.style.display = '';
        }

        const container = document.getElementById('rSections');
        // Prefer LLM-enhanced markdown, then sections array, then raw markdown
        if (result.enhanced_markdown) {
          const badge = document.createElement('div');
          badge.style.cssText = 'display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:3px 10px;border-radius:4px;background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.25);margin-bottom:12px;';
          badge.textContent = 'EPM Enhanced';
          container.appendChild(badge);
          const card = document.createElement('div');
          card.className = 'section-card md-content';
          card.innerHTML = (window.marked ? marked.parse(result.enhanced_markdown) : result.enhanced_markdown);
          container.appendChild(card);
        } else if (result.sections && result.sections.length) {
          result.sections.forEach(sec => {
            const card = document.createElement('div');
            card.className = 'section-card';
            const h = document.createElement('h2');
            h.textContent = sec.title || '';
            card.appendChild(h);
            const body = document.createElement('div');
            body.className = 'md-content';
            body.innerHTML = (window.marked ? marked.parse(sec.content || '') : sec.content || '');
            card.appendChild(body);
            container.appendChild(card);
          });
        } else if (result.markdown_content) {
          const card = document.createElement('div');
          card.className = 'section-card md-content';
          card.innerHTML = (window.marked ? marked.parse(result.markdown_content) : result.markdown_content);
          container.appendChild(card);
        }

        document.getElementById('reportContent').style.display = '';

        // Load agent activity after report is visible
        loadAgents(jobId);
      }

      async function load() {
        if (!jobId) { showError('No job ID provided.'); return; }
        try {
          const r = await fetch(`/api/deep/${jobId}/status`, { credentials: 'include' });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const data = await r.json();
          if (data.status === 'completed') {
            renderReport(data);
          } else if (data.status === 'failed') {
            showError('Analysis failed: ' + (data.error || 'unknown error'));
          } else {
            showError('Report not ready yet. Return to Fund Search to track progress.');
          }
        } catch (err) {
          showError('Could not load report: ' + err.message);
        }
      }

      load();

      // Avatar colour palette — assigns a consistent colour to each agent name
      const AVATAR_COLORS = [
        '#d4a84b','#3b82f6','#22c55e','#a855f7','#ef4444',
        '#06b6d4','#f97316','#84cc16','#ec4899','#14b8a6',
      ];
      function _avatarColor(name, idx) {
        return AVATAR_COLORS[idx % AVATAR_COLORS.length];
      }
      function _initials(name) {
        return name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      }

      // Tab toggle — exposed globally for onclick= attributes
      window.switchAgentTab = function (tab) {
        const agentWrap    = document.getElementById('agentListWrap');
        const timelineWrap = document.getElementById('agentTimelineWrap');
        const tabA = document.getElementById('tabByAgent');
        const tabT = document.getElementById('tabTimeline');
        if (tab === 'agents') {
          if (agentWrap)    agentWrap.style.display = '';
          if (timelineWrap) timelineWrap.style.display = 'none';
          if (tabA) tabA.classList.add('active');
          if (tabT) tabT.classList.remove('active');
        } else {
          if (agentWrap)    agentWrap.style.display = 'none';
          if (timelineWrap) timelineWrap.style.display = '';
          if (tabA) tabA.classList.remove('active');
          if (tabT) tabT.classList.add('active');
        }
      };

      // Agent Activity viewer — called from renderReport after report is visible
      async function loadAgents(jobId) {
        const section = document.getElementById('agentActivity');
        const loadingEl = document.getElementById('agentLoading');
        if (!section) return;

        section.style.display = '';
        try {
          const r = await fetch(`/api/deep/${jobId}/agents`, { credentials: 'include' });
          if (!r.ok) {
            if (loadingEl) loadingEl.textContent = `Agent data unavailable (HTTP ${r.status}).`;
            return;
          }
          const data = await r.json();
          if (!data.ok || !data.agents || !data.agents.length) {
            if (loadingEl) loadingEl.textContent = 'No agent activity recorded for this deliberation.';
            return;
          }

          if (loadingEl) loadingEl.style.display = 'none';

          // Build colour map so timeline and cards share the same colour per agent
          const colorMap = {};
          data.agents.forEach((a, i) => { colorMap[a.name] = _avatarColor(a.name, i); });

          // ── By-Agent cards ──────────────────────────────────────────────
          const list = document.getElementById('agentList');
          if (list) {
            list.innerHTML = data.agents.map((a, i) => {
              const color = colorMap[a.name];
              const noPosts = !a.posts || a.posts.length === 0;
              return `
                <details class="agent-card">
                  <summary class="agent-summary">
                    <div style="display:flex;align-items:center;gap:10px;">
                      <div class="tl-avatar" style="background:${color};width:28px;height:28px;font-size:10px;">${_initials(a.name)}</div>
                      <span class="agent-name">${a.name}</span>
                    </div>
                    <span class="agent-post-count">${a.post_count} post${a.post_count !== 1 ? 's' : ''}</span>
                  </summary>
                  ${a.bio ? `<div class="agent-bio">${a.bio}</div>` : ''}
                  <div class="agent-posts">
                    ${noPosts
                      ? '<div style="font-size:12px;color:var(--muted,#7d94c0);font-style:italic;">No posts in this deliberation.</div>'
                      : a.posts.map(p => `<div class="agent-post">${p}</div>`).join('')
                    }
                  </div>
                </details>`;
            }).join('');
          }
          // Both panels are built — show Transcript by default (switchAgentTab controls visibility)
          // ── Deliberation Script (Timeline) ──────────────────────────────
          const tlEl = document.getElementById('agentTimeline');
          const timeline = data.timeline || [];
          if (tlEl) {
            if (!timeline.length) {
              tlEl.innerHTML = '<div class="agent-empty">No deliberation posts recorded for this analysis.</div>';
            } else {
              const totalRounds = 72;
              const totalPosts = timeline.length;
              const header = `
                <div class="script-header">
                  <div class="script-title">DELIBERATION TRANSCRIPT</div>
                  <div class="script-meta">Analyst Council Deliberation &nbsp;·&nbsp; ${totalPosts} recorded statement${totalPosts !== 1 ? 's' : ''} &nbsp;·&nbsp; ${data.agents ? data.agents.length : '?'} analysts</div>
                  <div class="script-divider">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>
                </div>`;

              const lines = timeline.map((entry, idx) => {
                const color = colorMap[entry.agent] || AVATAR_COLORS[0];
                const roundLabel = entry.round != null ? `Round ${entry.round}` : (entry.ts ? `~Round ${Math.round((idx + 1) / totalPosts * totalRounds)}` : '');
                const prevAgent = idx > 0 ? timeline[idx - 1].agent : null;
                const isReply = prevAgent && prevAgent !== entry.agent;
                return `
                  <div class="script-line${isReply ? ' script-reply' : ''}">
                    <div class="script-speaker">
                      <span class="script-dot" style="background:${color};"></span>
                      <span class="script-name">${entry.agent.toUpperCase()}</span>
                      ${roundLabel ? `<span class="script-round">${roundLabel}</span>` : ''}
                    </div>
                    <div class="script-dialogue">${entry.content}</div>
                  </div>`;
              }).join('');

              tlEl.innerHTML = header + lines;
            }
          }

          // Default to Transcript tab so users see the deliberation flow, not agent cards
          switchAgentTab('timeline');
        } catch (err) {
          if (loadingEl) loadingEl.textContent = 'Could not load agent data.';
        }
      }

    })();
  </script>

  <div id="agentActivity" style="display:none;">
    <div class="agent-section-header">
      <div>
        <div class="agent-section-title">Analyst Council Deliberation</div>
        <div class="agent-section-note">Statements from the Analyst Council deliberation — By Agent for profiles, Transcript for deliberation flow</div>
      </div>
      <div class="agent-tabs">
        <button class="agent-tab" id="tabByAgent" onclick="switchAgentTab('agents')">By Agent</button>
        <button class="agent-tab active" id="tabTimeline" onclick="switchAgentTab('timeline')">Transcript</button>
      </div>
    </div>
    <div id="agentLoading" style="font-size:12px;color:var(--muted,#7d94c0);padding:8px 0;">Loading agent data…</div>
    <div id="agentListWrap" style="display:none;">
      <div id="agentList"></div>
    </div>
    <div id="agentTimelineWrap" style="display:none;">
      <div id="agentTimeline"></div>
    </div>
  </div>

</body>
</html>
