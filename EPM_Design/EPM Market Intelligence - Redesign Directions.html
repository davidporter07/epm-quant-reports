<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EPM Market Intelligence — Redesign Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; overscroll-behavior: none; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="lib/data.jsx"></script>
<script type="text/babel" src="lib/primitives.jsx"></script>

<script type="text/babel" src="directions/a-editorial/system.jsx"></script>
<script type="text/babel" src="directions/a-editorial/homepage.jsx"></script>
<script type="text/babel" src="directions/a-editorial/markets.jsx"></script>
<script type="text/babel" src="directions/a-editorial/forecasting.jsx"></script>
<script type="text/babel" src="directions/a-editorial/portfolios.jsx"></script>
<script type="text/babel" src="directions/a-editorial/fundsearch.jsx"></script>

<script type="text/babel" src="directions/b-terminal/system.jsx"></script>
<script type="text/babel" src="directions/b-terminal/homepage.jsx"></script>
<script type="text/babel" src="directions/b-terminal/markets.jsx"></script>
<script type="text/babel" src="directions/b-terminal/forecasting.jsx"></script>
<script type="text/babel" src="directions/b-terminal/portfolios.jsx"></script>
<script type="text/babel" src="directions/b-terminal/fundsearch.jsx"></script>

<script type="text/babel" src="directions/c-executive/system.jsx"></script>
<script type="text/babel" src="directions/c-executive/homepage.jsx"></script>
<script type="text/babel" src="directions/c-executive/markets.jsx"></script>
<script type="text/babel" src="directions/c-executive/forecasting.jsx"></script>
<script type="text/babel" src="directions/c-executive/portfolios.jsx"></script>
<script type="text/babel" src="directions/c-executive/fundsearch.jsx"></script>

<script type="text/babel">

function Intro() {
  return (
    <div style={{ padding: '40px 60px 10px', maxWidth: 1100 }}>
      <div style={{ fontSize: 12, letterSpacing: 2, textTransform: 'uppercase', color: '#6B5B3E', fontWeight: 600, marginBottom: 10 }}>
        EPM Market Intelligence · Redesign · V1
      </div>
      <div style={{ fontFamily: '"Source Serif 4", Georgia, serif', fontSize: 44, fontWeight: 600, color: '#1b1408', letterSpacing: -0.6, lineHeight: 1.1 }}>
        Three distinct directions for a more polished, more intentional Market Intelligence.
      </div>
      <div style={{ fontFamily: '"Inter", sans-serif', fontSize: 16, color: '#4a3f2e', marginTop: 14, maxWidth: 820, lineHeight: 1.55 }}>
        Each direction is a <b>full system</b> — not just a homepage — shown across the five core pages (Homepage, Markets, Forecasting, Model Portfolios, Fund Search).
        Anchor them against the current site: stronger nav, clearer page hierarchy, consistent cards, and a real brand voice.
        I can't access the live site from this environment, so colors use a deep EPM navy as a stand-in; swap in the real brand palette when we go deeper on a direction.
      </div>
    </div>
  );
}

function Rationale({ title, subtitle, body, type, spacing, components, palette }) {
  return (
    <div style={{
      width: 1440, background: '#FFFBF3', border: '1px solid #D9D3C4',
      padding: 36, fontFamily: '"Inter", sans-serif', color: '#2a2213',
    }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr 1fr 1fr', gap: 32 }}>
        <div>
          <div style={{ fontSize: 11, letterSpacing: 1.4, color: '#7a6a49', textTransform: 'uppercase', fontWeight: 600 }}>{subtitle}</div>
          <div style={{ fontFamily: '"Source Serif 4", Georgia, serif', fontSize: 28, fontWeight: 600, color: '#1b1408', letterSpacing: -0.3, marginTop: 4 }}>{title}</div>
          <div style={{ fontSize: 14, lineHeight: 1.55, color: '#3e3422', marginTop: 10 }}>{body}</div>
        </div>
        <Spec label="Typography" items={type} />
        <Spec label="Spacing & rhythm" items={spacing} />
        <Spec label="Components" items={components} />
      </div>
      <div style={{ marginTop: 24, paddingTop: 20, borderTop: '1px solid #D9D3C4', display: 'flex', gap: 14, alignItems: 'center' }}>
        <div style={{ fontSize: 11, letterSpacing: 1.2, color: '#7a6a49', textTransform: 'uppercase', fontWeight: 600, width: 130 }}>Palette</div>
        <div style={{ display: 'flex', gap: 8 }}>
          {palette.map((p, k) => (
            <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px', background: '#fff', border: '1px solid #E5DFCB', fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 11 }}>
              <div style={{ width: 16, height: 16, background: p.c, border: '1px solid rgba(0,0,0,0.08)' }} />
              <span>{p.n}</span>
              <span style={{ color: '#8a7b5b' }}>{p.c}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
function Spec({ label, items }) {
  return (
    <div>
      <div style={{ fontSize: 11, letterSpacing: 1.4, color: '#7a6a49', textTransform: 'uppercase', fontWeight: 600, marginBottom: 8 }}>{label}</div>
      {items.map((it, k) => (
        <div key={k} style={{ display: 'flex', gap: 10, padding: '4px 0', fontSize: 13, color: '#3e3422' }}>
          <span style={{ color: '#9a8a68', width: 90, flexShrink: 0 }}>{it[0]}</span>
          <span style={{ fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 12 }}>{it[1]}</span>
        </div>
      ))}
    </div>
  );
}

function Recommendation() {
  return (
    <div style={{
      width: 1440, background: '#0B1F3A', color: '#f1ecdc', padding: 44,
      fontFamily: '"Inter", sans-serif',
    }}>
      <div style={{ fontSize: 11, letterSpacing: 2, textTransform: 'uppercase', fontWeight: 600, color: '#C28A2B' }}>
        Recommendation
      </div>
      <div style={{ fontFamily: '"Source Serif 4", Georgia, serif', fontSize: 38, fontWeight: 600, letterSpacing: -0.4, marginTop: 8, lineHeight: 1.15 }}>
        Lead with <span style={{ color: '#C28A2B' }}>Direction C — Executive / Client-facing</span>,
        borrow A's typographic gravitas for research content, keep B as a power-user mode.
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 32, marginTop: 28 }}>
        <div>
          <div style={{ fontSize: 12, letterSpacing: 1.2, color: '#C28A2B', textTransform: 'uppercase', fontWeight: 600 }}>Why C wins</div>
          <div style={{ marginTop: 10, fontSize: 14, lineHeight: 1.6, color: '#e6dfce' }}>
            It's the only direction that scales from <i>internal EPM analyst</i> to <i>external client</i> without rebuilding.
            Cards are consistent, data is legible, the navy masthead carries EPM brand equity, and pills/soft backgrounds keep the page calm as data density rises.
            Direction A feels expensive but would slow analysts down. Direction B is strongest for power users but unsuitable for clients.
          </div>
        </div>
        <div>
          <div style={{ fontSize: 12, letterSpacing: 1.2, color: '#C28A2B', textTransform: 'uppercase', fontWeight: 600 }}>What to borrow from A</div>
          <div style={{ marginTop: 10, fontSize: 14, lineHeight: 1.6, color: '#e6dfce' }}>
            Use the serif display (Source Serif / GT Sectra) for research titles, commentary, and quote callouts — only there.
            Keep kicker eyebrows with uppercase tracking for section hierarchy. This gives EPM voice without losing product clarity.
          </div>
        </div>
        <div>
          <div style={{ fontSize: 12, letterSpacing: 1.2, color: '#C28A2B', textTransform: 'uppercase', fontWeight: 600 }}>What to borrow from B</div>
          <div style={{ marginTop: 10, fontSize: 14, lineHeight: 1.6, color: '#e6dfce' }}>
            Offer a "Dense" toggle on Markets / Watchlists for analysts — same data, compact row heights, mono numerics, ticker-first layout.
            Keep the command bar (⌘K) as a global shortcut. Both are power features that don't compromise the executive surface.
          </div>
        </div>
      </div>

      <div style={{ marginTop: 36, paddingTop: 22, borderTop: '1px solid rgba(255,255,255,0.12)' }}>
        <div style={{ fontSize: 12, letterSpacing: 1.2, color: '#C28A2B', textTransform: 'uppercase', fontWeight: 600, marginBottom: 14 }}>Shared fixes — apply to any direction</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 24, fontSize: 13.5, lineHeight: 1.55, color: '#e6dfce' }}>
          <div><b style={{ color: '#fff' }}>Nav.</b> One horizontal tier with product sections only. Utility (search, account, date/status) lives in a secondary strip. No overflow menus.</div>
          <div><b style={{ color: '#fff' }}>Page hierarchy.</b> Every page = eyebrow + title + one-line subtitle + section header pattern. Consistent across all five screens.</div>
          <div><b style={{ color: '#fff' }}>Card system.</b> One card component with three variants: KPI, panel, table. No ad-hoc containers. No card-with-coloured-icon pattern.</div>
          <div><b style={{ color: '#fff' }}>Spacing.</b> 4/8/16/24/40/56 px scale. Section gaps 40–56; intra-card 12–20. No values in between.</div>
          <div><b style={{ color: '#fff' }}>Numerics.</b> One mono family used for ALL tabular numbers, prices, and deltas. Never change-colors on labels — only on numbers.</div>
          <div><b style={{ color: '#fff' }}>Delta color.</b> Paired up/down soft chip backgrounds — never raw green/red text on light bg without containment.</div>
          <div><b style={{ color: '#fff' }}>Tables.</b> One table skin: 11px uppercase header, 13–14px rows, 56-px row height max, hairline dividers, ticker column left.</div>
          <div><b style={{ color: '#fff' }}>Brand moment.</b> Masthead logo mark + single accent (amber) appearing once per page — in the kicker, the avatar, the active-nav underline.</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <Intro />

      {/* DIRECTION A */}
      <DCSection
        title="Direction A — Editorial / Premium"
        subtitle="FT / CNBC Pro / Bloomberg.com lineage · for a future client-facing experience that reads as journalism-grade research"
      >
        <DCArtboard label="A · Homepage" width={1440}><EdaHomepage /></DCArtboard>
        <DCArtboard label="A · Markets" width={1440}><EdaMarkets /></DCArtboard>
        <DCArtboard label="A · Forecasting" width={1440}><EdaForecasting /></DCArtboard>
        <DCArtboard label="A · Model Portfolios" width={1440}><EdaPortfolios /></DCArtboard>
        <DCArtboard label="A · Fund Search" width={1440}><EdaFundSearch /></DCArtboard>
        <DCArtboard label="A · Rationale & specs" width={1440}>
          <Rationale
            subtitle="Direction A"
            title="Editorial / Premium"
            body="Leads with a serif display face, hairline rules, and a news-first hierarchy. Best positioning against peers — it feels like a credible publication, not a dashboard — and gives EPM a distinctive voice. Trade-off: reading density drops; analysts moving fast will want more compression."
            type={[['Display', 'Source Serif 4 · 600'], ['Body', 'Inter Tight · 400/500'], ['Numerics', 'SF Mono · 500'], ['Kicker', 'Inter 600 · 1.4 tracking'], ['Scale', '52 / 34 / 22 / 16 / 14 / 12']]}
            spacing={[['Gutter', '56 px outer'], ['Section', '48–56 px'], ['Intra-card', '24 px'], ['Row height', '48–56 px'], ['Rules', '1–2 px hairline']]}
            components={[['Container', 'Hairline card, no shadow'], ['Section head', 'Kicker + serif H2 + rule'], ['Delta', 'Mono text, semantic color'], ['Buttons', 'Sharp, 1px border, upper'], ['Nav', 'Underline on accent']]}
            palette={[
              { n: 'Ink', c: '#0E1A2B' }, { n: 'Paper', c: '#F6F1E6' }, { n: 'Rule', c: '#D9D3C4' },
              { n: 'Accent', c: '#9A6B1F' }, { n: 'Up', c: '#1F6B43' }, { n: 'Down', c: '#A6301B' },
            ]}
          />
        </DCArtboard>
      </DCSection>

      {/* DIRECTION B */}
      <DCSection
        title="Direction B — Terminal / Data-dense"
        subtitle="Bloomberg Terminal / Koyfin lineage · for internal EPM power users who live in the product"
      >
        <DCArtboard label="B · Homepage" width={1440}><TrmHomepage /></DCArtboard>
        <DCArtboard label="B · Markets" width={1440}><TrmMarkets /></DCArtboard>
        <DCArtboard label="B · Forecasting" width={1440}><TrmForecasting /></DCArtboard>
        <DCArtboard label="B · Model Portfolios" width={1440}><TrmPortfolios /></DCArtboard>
        <DCArtboard label="B · Fund Search" width={1440}><TrmFundSearch /></DCArtboard>
        <DCArtboard label="B · Rationale & specs" width={1440}>
          <Rationale
            subtitle="Direction B"
            title="Terminal / Data-dense"
            body="Compact sans + mono everywhere. Panels instead of cards. Command bar (⌘K) as a first-class input. Maximum information per square inch. Strongest for analysts; wrong for a client-facing future — too alienating, too much prior knowledge required."
            type={[['UI', 'IBM Plex Sans · 500/600'], ['Numerics', 'IBM Plex Mono · 500'], ['Base size', '11–12 px'], ['Kicker', 'Mono 10.5 · 0.5 tracking'], ['Scale', '22 / 16 / 13 / 12 / 11 / 10.5']]}
            spacing={[['Gutter', '20 px outer'], ['Section', '12 px'], ['Intra-panel', '12 px'], ['Row height', '28–32 px'], ['Rules', '1 px line-01 tokens']]}
            components={[['Container', 'Panel w/ titled header bar'], ['Section head', 'Mono uppercase in header strip'], ['Delta', 'Mono, +/- colored'], ['Buttons', 'Amber fill on black'], ['Nav', 'Tab w/ amber-fill active']]}
            palette={[
              { n: 'BG', c: '#0B0F14' }, { n: 'Panel', c: '#11161D' }, { n: 'Line', c: '#1E2732' },
              { n: 'Amber', c: '#E8A33D' }, { n: 'Up', c: '#36C58A' }, { n: 'Down', c: '#FF5A5A' },
            ]}
          />
        </DCArtboard>
      </DCSection>

      {/* DIRECTION C */}
      <DCSection
        title="Direction C — Executive / Client-facing  ★ recommended"
        subtitle="Addepar / Koyfin Pro / modern wealth platform lineage · scales from internal analyst to external client"
      >
        <DCArtboard label="C · Homepage" width={1440}><ExcHomepage /></DCArtboard>
        <DCArtboard label="C · Markets" width={1440}><ExcMarkets /></DCArtboard>
        <DCArtboard label="C · Forecasting" width={1440}><ExcForecasting /></DCArtboard>
        <DCArtboard label="C · Model Portfolios" width={1440}><ExcPortfolios /></DCArtboard>
        <DCArtboard label="C · Fund Search" width={1440}><ExcFundSearch /></DCArtboard>
        <DCArtboard label="C · Rationale & specs" width={1440}>
          <Rationale
            subtitle="Direction C ★"
            title="Executive / Client-facing"
            body="Navy masthead for brand carry-over, cool off-white canvas, disciplined cards with a single shadow token, soft up/down chips for deltas. Feels modern without being tech-y, credible without being austere. Scales cleanly from analyst density to a client surface."
            type={[['Display', 'GT Sectra (research)'], ['UI', 'Söhne / Inter · 500/600'], ['Numerics', 'JetBrains Mono · 500'], ['Eyebrow', 'Inter 600 · 0.8 tracking · teal'], ['Scale', '32 / 24 / 20 / 14 / 13 / 11']]}
            spacing={[['Gutter', '40 px outer'], ['Section', '20–22 px'], ['Intra-card', '16–24 px'], ['Row height', '40–48 px'], ['Radius', '6 px / 999 (chips)']]}
            components={[['Card', 'White, 1px line, single shadow'], ['Section head', 'Teal eyebrow + H2 + action link'], ['Pill', 'Soft bg + semantic fg'], ['Buttons', 'Navy fill / ghost / link'], ['Nav', 'Dark, amber underline active']]}
            palette={[
              { n: 'Navy', c: '#0B1F3A' }, { n: 'Canvas', c: '#F4F6FA' }, { n: 'Line', c: '#E3E7EE' },
              { n: 'Teal', c: '#1E7F74' }, { n: 'Amber', c: '#C28A2B' },
              { n: 'Up', c: '#0F8A56' }, { n: 'Down', c: '#B3271C' },
            ]}
          />
        </DCArtboard>
      </DCSection>

      {/* RECOMMENDATION */}
      <DCSection title="Recommendation & shared fixes" subtitle="the call, plus fixes that apply regardless of which direction we pick">
        <DCArtboard label="Recommendation" width={1440}><Recommendation /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
